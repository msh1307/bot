<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>서버 관리</title>
<style>
:root{color-scheme:dark;font:15px/1.55 system-ui,sans-serif;background:#15171b;color:#eef0f4}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit;background:#242830;border:1px solid #414751;border-radius:8px;padding:9px 12px}button{cursor:pointer;white-space:nowrap}button:hover{background:#303742}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #90b8ff;outline-offset:2px}button:disabled{opacity:.4;cursor:default}input,textarea{min-width:0}textarea{resize:vertical;width:100%;min-height:82px}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 22px;border-bottom:1px solid #343943}h1{font-size:19px;margin:0;margin-right:auto}h2{font-size:17px;margin:0}small,.muted{color:#acb5c4}main{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:calc(100vh - 80px)}aside{padding:18px;border-right:1px solid #343943}.search{display:flex;gap:6px}.search input{width:100%}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pages{margin:14px 0;justify-content:space-between}.chats{display:grid;gap:6px}.chat{text-align:left;display:block;width:100%;background:transparent}.chat[aria-pressed=true]{border-color:#8fb7fa;background:#26354a}.chat strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat small{font-size:12px}.detail{min-width:0;padding:22px;max-width:1150px;width:100%;margin:auto}.toolbar{justify-content:space-between;margin-bottom:14px}.actions{display:flex;gap:6px;flex-wrap:wrap}.feed{max-height:58vh;min-height:180px;overflow:auto;border:1px solid #343943;border-radius:10px;padding:14px;scrollbar-gutter:stable}.message{margin:0 0 14px;padding:12px 16px;border-radius:10px;background:#20242b}.message.user{background:#26354a}.message b{font-size:12px;color:#b7c9e8}.message pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 0}.composer{margin-top:16px}.composer .row{justify-content:space-between;margin-top:8px}.primary{background:#345886;border-color:#7296c3}.danger{color:#ffc3bf}.notice{padding:10px 22px;min-height:42px;background:#1c2027;overflow-wrap:anywhere}.notice.error{color:#ffb5ac}details{border-top:1px solid #343943;margin-top:24px;padding-top:16px}summary{cursor:pointer}details .row{margin:12px 0}.grow{flex:1;min-width:150px}.output{white-space:pre-wrap;overflow-wrap:anywhere;max-height:320px;overflow:auto;background:#101216;padding:12px;border-radius:8px;font:13px/1.6 ui-monospace,monospace}.file{display:block;text-align:left;margin:4px 0;width:100%}.empty{color:#acb5c4;padding:25px 10px}#cwd{display:block;overflow-wrap:anywhere;margin:7px 0 12px}#host{max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:760px){main{display:block}aside{border-right:0;border-bottom:1px solid #343943}.chats{max-height:240px;overflow:auto}.detail{padding:16px}.feed{max-height:52vh}header{padding:12px 16px}#host{display:none}}
</style>
<header><h1>서버 관리</h1><label for="server">서버</label><select id="server" aria-label="관리할 서버"></select><small id="host"></small><button id="logout">로그아웃</button></header>
<div id="notice" class="notice" role="status" aria-live="polite">연결 중…</div>
<main>
<aside>
  <form id="searchform" class="search"><input id="search" aria-label="대화 제목 검색" placeholder="대화 제목 검색"><button>검색</button></form>
  <div class="row pages"><button id="previous">앞 목록</button><small id="listpage">최근 대화</small><button id="next">다음 목록</button></div>
  <nav id="chats" class="chats" aria-label="Codex 대화 목록"></nav>
</aside>
<section class="detail">
  <div class="row toolbar"><h2 id="title">대화를 선택하세요</h2><div class="actions"><button id="refresh">최근 기록</button><button id="live">실시간 상태</button><button id="stop" class="danger">작업 중단</button></div></div>
  <small id="cwd"></small>
  <div id="feed" class="feed" aria-label="선택한 대화 기록"><p class="empty">왼쪽에서 기존 대화를 골라주세요.</p></div>
  <div class="row pages"><small>기록은 필요한 만큼만 불러옵니다.</small><button id="more">더 읽기</button></div>
  <form id="promptform" class="composer"><label for="prompt">이 대화에 보내기</label><textarea id="prompt" placeholder="진행 중이면 추가 지시, 끝났으면 같은 대화에서 이어서 처리합니다." maxlength="16000"></textarea><div class="row"><small>자동 재전송 없음 · 답변은 최근 기록으로 확인</small><button id="send" class="primary">전송</button></div></form>
  <details><summary>Windows 파일 조회</summary><form id="filesform" class="row"><input id="path" class="grow" aria-label="Windows 경로" placeholder="C:\경로"><button>폴더 보기</button><button type="button" id="readfile">파일 읽기</button></form><div id="files"></div><pre id="filetext" class="output" hidden></pre><button id="filemore" hidden>다음 부분</button></details>
  <details><summary>Windows 짧은 명령</summary><p class="muted">서버에 설정된 Windows 권한으로 실행합니다. 최대 15초.</p><form id="execform"><textarea id="command" aria-label="PowerShell 명령" placeholder="예: Get-Date" maxlength="8000"></textarea><div class="row"><button>명령 실행</button></div></form><pre id="execoutput" class="output" hidden></pre></details>
</section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
let busy=false,hosts=[],threads=[],selected=null,listCursors=[null],listIndex=0,nextList=null,historyCursor=null,fileNext=null;
function notice(text,error=false){$('notice').textContent=text;$('notice').classList.toggle('error',error)}
function controls(){document.querySelectorAll('button,input,select,textarea').forEach(e=>e.disabled=busy);for(const id of ['refresh','live','stop','send'])$(id).disabled=busy||!selected;$('previous').disabled=busy||listIndex===0;$('next').disabled=busy||!nextList;$('more').disabled=busy||!historyCursor}
async function run(work){if(busy)return;busy=true;controls();try{await work()}catch(e){notice(e.message,true)}finally{busy=false;controls()}}
async function call(args){const response=await fetch('/manage/api/call',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...args,server:$('server').value})});let result;try{result=await response.json()}catch(e){throw Error('연결이 끊겼습니다. 상태 확인 후 다시 시도하세요.')}if(!response.ok||result.success===false)throw Error(result.error||'관리 로그인 만료: /access에서 다시 열어주세요.');return result}
function blank(){selected=null;historyCursor=null;$('title').textContent='대화를 선택하세요';$('cwd').textContent='';$('feed').replaceChildren();$('prompt').value=''}
function stateLabel(value){return {notLoaded:'저장된 기록',idle:'대기 중',running:'작업 중',inProgress:'작업 중',completed:'완료',interrupted:'중단됨',failed:'실패'}[value]||value||'기록'}
async function list(cursor=null){notice('대화 목록을 읽는 중…');const r=await call({action:'list',limit:12,cursor:cursor||undefined,search:$('search').value||undefined});threads=r.threads||[];nextList=r.next_cursor;$('chats').replaceChildren();for(const t of threads){const b=document.createElement('button');b.className='chat';b.setAttribute('aria-pressed',String(selected?.thread_id===t.thread_id));const title=document.createElement('strong');title.textContent=t.title||'제목 없음';b.title=title.textContent;const meta=document.createElement('small');meta.textContent=stateLabel(t.runtime_status||t.stored_status);b.append(title,meta);b.onclick=()=>run(async()=>{selected=t;document.querySelectorAll('.chat').forEach(c=>c.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');await read()});$('chats').append(b)}if(!threads.length)$('chats').textContent='일치하는 대화가 없습니다.';$('listpage').textContent=`${listIndex+1}쪽 · ${threads.length}개`;notice('목록 조회 완료')}
function render(r){$('title').textContent=r.title||selected.title||'Codex 대화';$('cwd').textContent=r.cwd||'';$('feed').replaceChildren();const messages=r.recent_messages||[];for(const m of messages){const article=document.createElement('article');article.className='message '+m.role;const name=document.createElement('b');name.textContent=(m.role==='user'?'사용자':'Codex')+(m.continued?' · 이어지는 내용':'');const text=document.createElement('pre');text.textContent=m.text;article.append(name,text);$('feed').append(article)}if(!messages.length){const p=document.createElement('p');p.className='empty';p.textContent=r.answer||'표시할 메시지가 없습니다.';$('feed').append(p)}historyCursor=r.next_cursor||null;const pending=r.pending_requests||[];notice(pending.length?`사용자 확인 ${pending.length}건 · Codex 앱에서 확인하세요.`:stateLabel(r.phase||r.turn_status||'기록 조회 완료'))}
async function read(cursor){if(!selected)return;notice('기록을 읽는 중…');render(await call({action:'read',thread_id:selected.thread_id,cursor:cursor||undefined}))}
$('searchform').onsubmit=e=>{e.preventDefault();run(async()=>{blank();listCursors=[null];listIndex=0;await list()})};
$('server').onchange=()=>run(async()=>{blank();$('search').value='';$('path').value='';$('command').value='';$('files').replaceChildren();$('filetext').hidden=$('filemore').hidden=$('execoutput').hidden=true;listCursors=[null];listIndex=0;const host=hosts.find(s=>s.id===$('server').value);$('host').textContent=host?.address||'';await list()});
$('next').onclick=()=>run(async()=>{listCursors=listCursors.slice(0,listIndex+1);listCursors.push(nextList);listIndex++;await list(nextList)});
$('previous').onclick=()=>run(async()=>{listIndex--;await list(listCursors[listIndex])});
$('refresh').onclick=()=>run(()=>read());$('more').onclick=()=>run(()=>read(historyCursor));
$('live').onclick=()=>run(async()=>{notice('실시간 상태 조회 중…');render(await call({action:'status',thread_id:selected.thread_id}))});
$('stop').onclick=()=>run(async()=>{const r=await call({action:'stop',thread_id:selected.thread_id});notice(r.message||'중단 요청을 보냈습니다.')});
$('promptform').onsubmit=e=>{e.preventDefault();if(!$('prompt').value.trim())return;run(async()=>{notice('전송 중…');const r=await call({action:'send',thread_id:selected.thread_id,prompt:$('prompt').value});$('prompt').value='';notice(r.mode==='steer'?'진행 중인 작업에 추가 지시를 보냈습니다.':'같은 대화에 보냈습니다. 최근 기록 버튼으로 답변을 확인하세요.')})};
async function files(offset=0){const r=await call({action:'file_list',path:$('path').value,offset,limit:50});$('files').replaceChildren();for(const entry of r.entries||[]){const b=document.createElement('button');b.className='file';b.textContent=(entry.isDirectory?'📁 ':'')+entry.fileName;b.onclick=()=>run(async()=>{$('path').value=r.path.replace(/[\\/]$/,'')+'\\'+entry.fileName;if(entry.isDirectory)await files();else await file()});$('files').append(b)}if(r.next_offset!=null){const b=document.createElement('button');b.textContent='다음 파일';b.onclick=()=>run(()=>files(r.next_offset));$('files').append(b)}notice('폴더 조회 완료')}
async function file(start=1){const r=await call({action:'file_read',path:$('path').value,start_line:start,limit:200});$('filetext').hidden=false;$('filetext').textContent=r.text;fileNext=r.next_line;$('filemore').hidden=!fileNext;notice(r.partial_line?'긴 줄 일부만 표시됐습니다.':`파일 ${r.start_line}–${r.end_line}행`)}
$('filesform').onsubmit=e=>{e.preventDefault();run(()=>files())};$('readfile').onclick=()=>run(()=>file());$('filemore').onclick=()=>run(()=>file(fileNext));
$('execform').onsubmit=e=>{e.preventDefault();if(!$('command').value.trim())return;run(async()=>{notice('Windows 명령 실행 중…');const r=await call({action:'exec',command:['powershell.exe','-NoLogo','-NoProfile','-NonInteractive','-Command',$('command').value],timeout_ms:15000});$('execoutput').hidden=false;$('execoutput').textContent=`종료 코드 ${r.exit_code}\n${r.stdout||''}${r.stderr||''}`;notice(r.truncated?'명령 실행 완료 · 출력 일부만 표시':'명령 실행 완료')})};
$('logout').onclick=()=>run(async()=>{await fetch('/manage/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});location.replace('/manage/login')});
run(async()=>{const r=await fetch('/manage/api/servers');if(!r.ok)throw Error('관리 로그인 만료: /access에서 다시 열어주세요.');hosts=(await r.json()).servers;for(const h of hosts){const option=document.createElement('option');option.value=h.id;option.textContent=h.name;option.selected=h.default;$('server').append(option)}$('host').textContent=hosts.find(h=>h.id===$('server').value)?.address||'';await list()});
</script>
</html>
